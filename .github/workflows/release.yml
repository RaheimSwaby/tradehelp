name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Electron's postinstall pulls a ~100 MB binary from GitHub, and that request is
      # the flakiest part of this pipeline. A socket hang up there failed the Linux
      # build of v0.48.1, and because publish-release needs every build job, the
      # release went public with 8 of 10 assets and no Linux download at all. Retrying
      # in place beats noticing afterwards and re-running by hand.
      # shell: bash is explicit because this job also runs on windows-latest, where
      # run: defaults to PowerShell and this loop would not parse.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed on attempt $attempt, retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "npm ci failed three times; treating as a real failure"
          exit 1
      - run: npm test

  build:
    needs: test
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Electron's postinstall pulls a ~100 MB binary from GitHub, and that request is
      # the flakiest part of this pipeline. A socket hang up there failed the Linux
      # build of v0.48.1, and because publish-release needs every build job, the
      # release went public with 8 of 10 assets and no Linux download at all. Retrying
      # in place beats noticing afterwards and re-running by hand.
      # shell: bash is explicit because this job also runs on windows-latest, where
      # run: defaults to PowerShell and this loop would not parse.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed on attempt $attempt, retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "npm ci failed three times; treating as a real failure"
          exit 1
      - run: npm run build
      # Windows and Linux get no Apple credentials at all — electron-builder also reads
      # CSC_LINK for Windows signing, so handing it the Apple .p12 would fail that build.
      - name: Build & publish installer
        if: matrix.os != 'macos-latest'
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish installer (macOS, signed + notarised)
        if: matrix.os == 'macos-latest'
        shell: bash
        # A secret pasted through the GitHub UI can carry a trailing newline. Apple's
        # notary service then rejects it with "HTTP 401 Invalid credentials", which reads
        # like a wrong password and cost a release to track down — the credentials were
        # correct, the newline was not. Strip CR/LF before electron-builder sees them.
        run: |
          export APPLE_ID="$(printf '%s' "$APPLE_ID" | tr -d '\r\n')"
          export APPLE_APP_SPECIFIC_PASSWORD="$(printf '%s' "$APPLE_APP_SPECIFIC_PASSWORD" | tr -d '\r\n')"
          export APPLE_TEAM_ID="$(printf '%s' "$APPLE_TEAM_ID" | tr -d '\r\n')"
          npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # A universal app can still be signed, notarised and uploaded while carrying
      # an arm64-only native module. That made v0.50.2 unusable on every Intel Mac.
      # Inspect the finished app, not the build log, before this job is allowed to
      # succeed. The release remains a private draft if either architecture is wrong.
      - name: Verify macOS native module architectures
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          app="dist/mac-universal/TradeHelp.app"
          executable="$app/Contents/MacOS/TradeHelp"
          common_sqlite="$app/Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          x64_sqlite="$app/Contents/Resources/app-x64.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          arm64_sqlite="$app/Contents/Resources/app-arm64.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node"

          check_arch() {
            local label="$1"
            local path="$2"
            local expected="$3"

            if [ ! -f "$path" ]; then
              echo "::error::$label is missing: $path"
              exit 1
            fi

            local arches
            arches="$(lipo -archs "$path")"
            echo "$label architectures: $arches"
            case " $arches " in
              *" $expected "*) ;;
              *)
                echo "::error::$label must contain $expected, found: $arches"
                exit 1
                ;;
            esac
          }

          check_arch "TradeHelp executable" "$executable" "x86_64"
          check_arch "TradeHelp executable" "$executable" "arm64"

          if [ -f "$x64_sqlite" ] && [ -f "$arm64_sqlite" ]; then
            check_arch "Intel better_sqlite3.node" "$x64_sqlite" "x86_64"
            check_arch "Apple Silicon better_sqlite3.node" "$arm64_sqlite" "arm64"
          elif [ -f "$common_sqlite" ]; then
            check_arch "Universal better_sqlite3.node" "$common_sqlite" "x86_64"
            check_arch "Universal better_sqlite3.node" "$common_sqlite" "arm64"
          else
            echo "::error::No packaged better_sqlite3.node was found"
            exit 1
          fi

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # electron-builder uploads into a draft release, so nothing is downloadable
      # until every platform has finished and this job flips it public. Before
      # v0.48.1 the release went live the moment the first platform uploaded, which
      # is how v0.47.3 and v0.47.4 sat published with only the Windows installer
      # while macOS and Linux users saw an update they could not download.
      #
      # A healthy release carries 10 files: three installers, two blockmaps for the
      # macOS pair and one for Windows, and the three latest*.yml update manifests.
      # Anything short means a platform did not publish, so the release stays a
      # draft: invisible and recoverable, rather than public and broken.
      - name: Verify every platform published
        run: |
          gh release view "$TAG" --repo RaheimSwaby/tradehelp --json assets --jq '.assets[].name' | sort > assets.txt
          echo "assets on $TAG:"
          sed 's/^/  /' assets.txt
          missing=0
          for required in \
            latest.yml latest-mac.yml latest-linux.yml \
            TradeHelp-Setup.exe TradeHelp-Setup.exe.blockmap \
            TradeHelp-Setup.dmg TradeHelp-Setup.dmg.blockmap \
            TradeHelp-Setup.zip TradeHelp-Setup.zip.blockmap \
            TradeHelp-Setup.AppImage; do
            if ! grep -Fxq "$required" assets.txt; then
              echo "::error::Missing required release asset: $required"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Leaving $TAG as a draft. Re-run the failed platform build, then this job."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

      - name: Mark release as published
        run: gh release edit "$TAG" --draft=false --repo RaheimSwaby/tradehelp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
