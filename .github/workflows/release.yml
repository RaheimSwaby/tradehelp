name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Electron's postinstall pulls a ~100 MB binary from GitHub, and that request is
      # the flakiest part of this pipeline. A socket hang up there failed the Linux
      # build of v0.48.1, and because publish-release needs every build job, the
      # release went public with 8 of 10 assets and no Linux download at all. Retrying
      # in place beats noticing afterwards and re-running by hand.
      # shell: bash is explicit because this job also runs on windows-latest, where
      # run: defaults to PowerShell and this loop would not parse.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed on attempt $attempt, retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "npm ci failed three times; treating as a real failure"
          exit 1
      - run: npm test

  build:
    needs: test
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Electron's postinstall pulls a ~100 MB binary from GitHub, and that request is
      # the flakiest part of this pipeline. A socket hang up there failed the Linux
      # build of v0.48.1, and because publish-release needs every build job, the
      # release went public with 8 of 10 assets and no Linux download at all. Retrying
      # in place beats noticing afterwards and re-running by hand.
      # shell: bash is explicit because this job also runs on windows-latest, where
      # run: defaults to PowerShell and this loop would not parse.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed on attempt $attempt, retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "npm ci failed three times; treating as a real failure"
          exit 1
      - run: npm run build
      # Windows and Linux get no Apple credentials at all — electron-builder also reads
      # CSC_LINK for Windows signing, so handing it the Apple .p12 would fail that build.
      - name: Build & publish installer
        if: matrix.os != 'macos-latest'
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish installer (macOS, signed + notarised)
        if: matrix.os == 'macos-latest'
        shell: bash
        # A secret pasted through the GitHub UI can carry a trailing newline. Apple's
        # notary service then rejects it with "HTTP 401 Invalid credentials", which reads
        # like a wrong password and cost a release to track down — the credentials were
        # correct, the newline was not. Strip CR/LF before electron-builder sees them.
        run: |
          export APPLE_ID="$(printf '%s' "$APPLE_ID" | tr -d '\r\n')"
          export APPLE_APP_SPECIFIC_PASSWORD="$(printf '%s' "$APPLE_APP_SPECIFIC_PASSWORD" | tr -d '\r\n')"
          export APPLE_TEAM_ID="$(printf '%s' "$APPLE_TEAM_ID" | tr -d '\r\n')"
          npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as published
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo RaheimSwaby/tradehelp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
